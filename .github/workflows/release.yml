name: Dashboard Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Verify release version and bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - "$RELEASE_TAG" <<'PY'
          import json
          import pathlib
          import sys

          tag_version = sys.argv[1].removeprefix("v")
          package = json.loads(pathlib.Path("package.json").read_text())
          bundle = pathlib.Path("dist/ha-pi-manager-dashboard.js")
          if package["version"] != tag_version:
              raise SystemExit(f"tag {tag_version} does not match package {package['version']}")
          if not bundle.is_file() or bundle.stat().st_size == 0:
              raise SystemExit("dashboard bundle is missing or empty")
          print(f"release version and bundle PASS: {tag_version}")
          PY
          sha256sum dist/ha-pi-manager-dashboard.js > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/ha-pi-manager-dashboard.js SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/ha-pi-manager-dashboard.js SHA256SUMS.txt \
              --verify-tag \
              --title "Pi Manager Dashboard $GITHUB_REF_NAME" \
              --generate-notes
          fi
